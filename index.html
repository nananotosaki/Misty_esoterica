<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Misty's esotrica</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
    <!-- Latest compiled and minified CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="d-flex flex-column justify-content-center align-items-center" style="height: 100vh;">
    <div class="p-2">
     <h1 class="display-1">What's your Tarot?</h1>
    </div>
    <div class="p-2">
      <button type="button" class="btn btn-primary p-2" data-bs-toggle="modal" data-bs-target="#myModal" onclick="tarot()">
        Draw your cards
      </button>
    </div>
</div>

<!-- The Modal -->
<div class="modal" id="myModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <!-- Modal Header -->
      <div class="modal-header">
        <h4 class="modal-title">My cards</h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <!-- Modal body -->
      <div class="modal-body">
    <div class="row g-3"> <!-- Added row with gap -->
        <div class="col-md-4"> <!-- Each card takes 1/3 of the width on medium+ screens -->
            <div class="card h-100 text-center p-2"> <!-- Added card styling -->
                <img id="card_1_img" class="img-thumbnail" src="" alt="">
                <div class="card-body">
                    <h5 id="card_1_name" class="card-title"></h5>
                    <p id="card_1_meaning" class="card-text"></p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100 text-center p-2">
                <img id="card_2_img" class="img-thumbnail" src="" alt="">
                <div class="card-body">
                    <h5 id="card_2_name" class="card-title"></h5>
                    <p id="card_2_meaning" class="card-text"></p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100 text-center p-2">
                <img id="card_3_img" class="img-thumbnail" src="" alt="">
                <div class="card-body">
                    <h5 id="card_3_name" class="card-title"></h5>
                    <p id="card_3_meaning" class="card-text"></p>
                </div>
            </div>
        </div>
    </div>
</div>
      <!-- Modal footer -->
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
      </div>

    </div>
  </div>
</div>
</div>

</body>
</html>
